# =====================================================
# 敦煌金质检 LIMS - Nginx 主配置(生产)
# 详见 docs/05-DEPLOYMENT.md §Nginx 反向代理
#
# 设计原则:
#   - 仅监听 80 (HTTP→HTTPS 重定向) + 443 (TLS)
#   - TLS 1.2/1.3,禁用弱算法
#   - 安全响应头(HSTS / CSP / X-Frame-Options)
#   - 反向代理 backend + 静态前端
#   - 上传大小限制 + 超时配置
# =====================================================

user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    use epoll;
    multi_accept on;
}

http {
    # ============================================
    # 基础
    # ============================================
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    # 字符集
    charset utf-8;

    # 日志格式(含请求耗时 + upstream 耗时)
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" '
                      'rt=$request_time uct=$upstream_connect_time '
                      'uht=$upstream_header_time urt=$upstream_response_time';

    access_log  /var/log/nginx/access.log  main buffer=32k flush=5s;

    # ============================================
    # 性能
    # ============================================
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    server_names_hash_bucket_size 128;

    # 上传大小(PDF 报告最大 50MB)
    client_max_body_size 50m;
    client_body_buffer_size 128k;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;
    client_body_timeout 60s;
    client_header_timeout 60s;
    send_timeout 60s;

    # gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/opentype
        image/svg+xml
        image/x-icon;

    # ============================================
    # 安全响应头(全局,所有 server 生效)
    # ============================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # HSTS(若用 HTTPS,建议一年 + includeSubDomains)
    # 注意:仅在 HTTPS server 块添加,避免 HTTP 阶段就锁死
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ============================================
    # 限流(防爆破 + 防爬)
    # ============================================
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # 隐藏 nginx 版本
    more_clear_headers Server;

    # ============================================
    # upstream backend
    # ============================================
    upstream lims_backend {
        server backend:3030 max_fails=3 fail_timeout=30s;
        keepalive 32;
        keepalive_requests 1000;
        keepalive_timeout 60s;
    }

    # ============================================
    # 子配置
    # ============================================
    include /etc/nginx/conf.d/*.conf;
}

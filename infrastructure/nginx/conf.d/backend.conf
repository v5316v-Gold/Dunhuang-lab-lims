# =====================================================
# 敦煌金质检 LIMS - 后端 API 反代
# /api/* → backend:3030
# =====================================================

# HTTP → HTTPS 重定向
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ACME challenge(Let's Encrypt,可选)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 健康检查(负载均衡用)
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # 其余全部跳转 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS - 后端 API
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name lims.dunhuang-lab.local _;

    # SSL 配置
    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # HSTS(强制 HTTPS 一年)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 日志
    access_log /var/log/nginx/api.access.log main buffer=32k flush=5s;
    error_log  /var/log/nginx/api.error.log warn;

    # 连接限制
    limit_conn conn_limit 50;

    # ===== API 端点 =====
    location /api/ {
        limit_req zone=api_limit burst=120 nodelay;

        # 反代头
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # 反代配置
        proxy_pass http://lims_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
        proxy_buffering on;
        proxy_buffers 16 16k;
        proxy_buffer_size 32k;

        # 不缓存 API
        proxy_cache off;
        proxy_no_cache 1;
        proxy_cache_bypass 1;

        # gzip 上游响应
        gzip on;
    }

    # ===== Prometheus metrics(仅内网) =====
    location = /metrics {
        # 限制来源 IP(检测中心内网段)
        allow 192.168.0.0/16;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        deny  all;
        access_log off;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_pass http://lims_backend;
    }

    # ===== 健康检查 =====
    location /health {
        access_log off;
        proxy_pass http://lims_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # ===== Swagger UI =====
    location /api/docs {
        # 内网可见(评审员访问)
        proxy_pass http://lims_backend/api/docs;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}

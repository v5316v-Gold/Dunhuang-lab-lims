apiVersion: 1

# 自动加载 dashboards/
providers:
  - name: 'dunhuang-lims'
    orgId: 1
    folder: 'Dunhuang LIMS'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
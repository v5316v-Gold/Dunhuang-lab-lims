# ==========================================================
# 敦煌金质检 LIMS - 生产环境 Docker Compose
# 详见 docs/05-DEPLOYMENT.md §生产部署
#
# 设计原则:
#   - 仅 4 个核心服务:nginx + backend + postgres + redis
#   - PG/Redis 不暴露 host 端口,仅内部网络访问
#   - 后端只读 fs + 资源限制
#   - 镜像版本锁,不用 latest
#   - 网络分段:frontend-net(nginx<->frontend 在外部反向时) / backend-net / data-net
#
# 启动:  docker compose -f docker-compose.prod.yml up -d
# 停止:  docker compose -f docker-compose.prod.yml down
# 日志:  docker compose -f docker-compose.prod.yml logs -f
# 备份:  ./deploy/backup/full-backup.sh
# ==========================================================

name: dunhuang-lims-prod

x-pg-env: &pg-env
  POSTGRES_DB: ${POSTGRES_DB:-dunhuang_lims}
  POSTGRES_USER: ${POSTGRES_USER:-dunhuang}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?必须设置 POSTGRES_PASSWORD}
  PGDATA: /var/lib/postgresql/data/pgdata

services:
  # ========================================
  # PostgreSQL 16 + TimescaleDB(数据层,不暴露)
  # ========================================
  postgres:
    image: timescale/timescaledb:2.16.1-pg16
    container_name: dunhuang-pg-prod
    restart: unless-stopped
    environment:
      <<: *pg-env
      TS_TUNE_MEMORY: ${PG_TS_MEMORY:-2GB}
      TS_TUNE_NUM_CPUS: ${PG_TS_CPUS:-2}
    # 仅 backend 网络可访问
    ports: []
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
      - ./infrastructure/docker/postgres/triggers/audit_chain.sql:/docker-entrypoint-initdb.d/01-audit-chain.sql:ro
      - ./infrastructure/docker/postgres/triggers/audit_chain_triggers.sql:/docker-entrypoint-initdb.d/02-audit-chain-triggers.sql:ro
      - ./infrastructure/docker/postgres/triggers/no_modify_audit.sql:/docker-entrypoint-initdb.d/03-no-modify-audit.sql:ro
      - ./infrastructure/docker/postgres/triggers/no_modify_audit_triggers.sql:/docker-entrypoint-initdb.d/04-no-modify-audit-triggers.sql:ro
      - ./infrastructure/docker/postgres/triggers/timescaledb.sql:/docker-entrypoint-initdb.d/05-timescaledb.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - data-net
    # 资源限制(2C4G 起步)
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G
    # 容器只读 fs + 临时目录(防止篡改可执行文件)
    read_only: false   # PG 需要写入 WAL,不能全只读
    tmpfs:
      - /tmp:size=256M,mode=1777
    security_opt:
      - no-new-privileges:true

  # ========================================
  # Redis 7(缓存/会话)
  # ========================================
  redis:
    image: redis:7.4-alpine
    container_name: dunhuang-redis-prod
    restart: unless-stopped
    command: >
      sh -c "
        redis-server --appendonly yes
        --maxmemory 512mb
        --maxmemory-policy allkeys-lru
        --requirepass $${REDIS_PASSWORD:?必须设置 REDIS_PASSWORD}
      "
    ports: []
    expose:
      - "6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '$${REDIS_PASSWORD}', 'ping']
      interval: 15s
      timeout: 3s
      retries: 5
    networks:
      - data-net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    security_opt:
      - no-new-privileges:true

  # ========================================
  # 后端 NestJS
  # ========================================
  backend:
    image: dunhuang-lims-backend:${APP_VERSION:-1.0.0}
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: dunhuang-backend-prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # 必填项(无默认值,启动时校验)
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?必须设置 JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?必须设置 JWT_REFRESH_SECRET}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?必须设置 TOTP_ENCRYPTION_KEY}
      # 应用配置
      NODE_ENV: production
      APP_PORT: 3030
      API_PREFIX: api
      API_GLOBAL_PREFIX: ""
      CORS_ORIGINS: ${CORS_ORIGINS:-https://lims.dunhuang-lab.local}
      CORS_CREDENTIALS: "true"
      # 阈值
      THROTTLE_TTL: ${THROTTLE_TTL:-60}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-100}
      # 日志
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # 可观测
      METRICS_ENABLED: "true"
      METRICS_PATH: "/metrics"
    ports:
      - "127.0.0.1:3030:3030"   # 仅本机访问,nginx 反代
    volumes:
      - backend-logs:/app/logs
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:3030/health/live']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - backend-net
      - data-net
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G
    security_opt:
      - no-new-privileges:true
    # 后端 fs 只读 + tmpfs(日志卷单独挂载)
    read_only: true
    tmpfs:
      - /tmp:size=256M,mode=1777

  # ========================================
  # Nginx 反向代理 + TLS 终结
  # ========================================
  nginx:
    image: nginx:1.27.3-alpine
    container_name: dunhuang-nginx-prod
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infrastructure/nginx/ssl:/etc/nginx/ssl:ro
      - nginx-logs:/var/log/nginx
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/health']
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - backend-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    security_opt:
      - no-new-privileges:true

# ========================================
# 网络分段
# ========================================
networks:
  backend-net:
    driver: bridge
    name: dunhuang-backend
  data-net:
    driver: bridge
    name: dunhuang-data
    internal: true   # PG/Redis 完全隔离,无外网出站

# ========================================
# 数据卷
# ========================================
volumes:
  pgdata:
    name: dunhuang-pgdata
    driver: local
  redisdata:
    name: dunhuang-redisdata
    driver: local
  backend-logs:
    name: dunhuang-backend-logs
    driver: local
  nginx-logs:
    name: dunhuang-nginx-logs
    driver: local

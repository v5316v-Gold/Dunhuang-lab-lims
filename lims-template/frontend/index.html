<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LIMS 登录</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; background: #f0f2f5; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .login-card { background: #fff; border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,0.1); padding: 48px 40px; width: 380px; }
    .login-card h1 { font-size: 24px; color: #1a73e8; margin-bottom: 8px; text-align: center; }
    .login-card p { color: #666; text-align: center; margin-bottom: 32px; font-size: 14px; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 14px; color: #333; margin-bottom: 6px; font-weight: 500; }
    .form-group input { width: 100%; padding: 10px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; transition: border-color 0.2s; }
    .form-group input:focus { border-color: #1a73e8; }
    .btn { width: 100%; padding: 12px; background: #1a73e8; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    .btn:hover { background: #1557b0; }
    .btn:disabled { background: #9ac0e8; cursor: not-allowed; }
    .error { color: #e53935; font-size: 13px; margin-top: 8px; min-height: 18px; text-align: center; }
    .footer { text-align: center; margin-top: 24px; font-size: 12px; color: #999; }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>🔬 LIMS 系统</h1>
    <p>实验室信息管理系统</p>
    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>用户名</label>
        <input type="text" id="username" placeholder="请输入用户名" autocomplete="username" required />
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password" required />
      </div>
      <button type="submit" class="btn" id="loginBtn">登 录</button>
      <div class="error" id="errorMsg"></div>
    </form>
    <div class="footer">LIMS Template v0.1.0</div>
  </div>

  <script>
    const API_BASE = "http://localhost:8000/api/v1";
    let loginAttempted = false;

    async function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      const btn = document.getElementById("loginBtn");
      const errEl = document.getElementById("errorMsg");

      errEl.textContent = "";
      btn.disabled = true;
      btn.textContent = "登录中...";

      try {
        const resp = await fetch(`${API_BASE}/auth/login`, {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: new URLSearchParams({ username, password }),
        });

        if (!resp.ok) {
          const data = await resp.json().catch(() => ({}));
          throw new Error(data.detail || `登录失败 (${resp.status})`);
        }

        const data = await resp.json();
        localStorage.setItem("lims_access_token", data.access_token);
        localStorage.setItem("lims_refresh_token", data.refresh_token);

        window.location.href = "dashboard.html";
      } catch (err) {
        errEl.textContent = err.message;
        btn.disabled = false;
        btn.textContent = "登 录";
      }
    }

    // Auto-focus
    document.getElementById("username").focus();
  </script>
</body>
</html>
